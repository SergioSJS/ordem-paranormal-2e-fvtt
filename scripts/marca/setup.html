<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"OP2 Display";src:url("../../assets/fonts/big-shoulders-latin.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"OP2 Mono";src:url("../../assets/fonts/cutive-mono-latin.woff2") format("woff2")}
@font-face{font-family:"OP2 Texto";src:url("../../assets/fonts/bitter-latin.woff2") format("woff2");font-weight:100 900}
html,body{margin:0;background:#120d0b}
.card{position:relative;width:1200px;height:675px;overflow:hidden;background:
  radial-gradient(ellipse at 20% 30%,#2a1611 0%,#160f0d 55%,#0f0a09 100%);color:#f2ede6;font-family:"OP2 Texto",serif}
.grade{position:absolute;inset:0;background-image:linear-gradient(rgba(242,237,230,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,230,.045) 1px,transparent 1px);background-size:75px 75px}
.faixa{position:absolute;left:-120px;top:0;width:300px;height:675px;background:#c8321e;transform:skewX(-14deg);opacity:.92}
.faixa2{position:absolute;left:150px;top:0;width:14px;height:675px;background:#e0472f;transform:skewX(-14deg);opacity:.6}
.canto{position:absolute;width:70px;height:70px;border:3px solid #c8321e}
.canto.tl{left:270px;top:56px;border-right:0;border-bottom:0}.canto.br{right:126px;top:56px;border-left:0;border-bottom:0}
.titulo{position:absolute;left:300px;top:112px;font-family:"OP2 Display";font-weight:800;font-size:132px;line-height:.86;letter-spacing:.01em;text-transform:uppercase}
.titulo small{display:block;font-size:54px;font-weight:600;color:#e0472f;letter-spacing:.08em;margin-top:14px}
.sub{position:absolute;left:304px;top:470px;font-family:"OP2 Mono",monospace;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#cfc6bb}
.dados{position:absolute;left:304px;top:522px;display:flex;gap:14px;font-family:"OP2 Mono",monospace;font-size:20px;color:#f2ede6}
.dados span{border:2px solid #c8321e;padding:6px 14px;background:rgba(200,50,30,.14)}
.dados .seta{border:0;background:none;color:#e0472f;padding:6px 2px}
.selo{position:absolute;right:134px;bottom:70px;width:144px}
.mono{position:absolute;left:304px;bottom:44px;font-family:"OP2 Mono",monospace;font-size:15px;letter-spacing:.12em;color:#8f857a;text-transform:uppercase}
</style></head><body><div class="card">
<div class="grade"></div><div class="faixa"></div><div class="faixa2"></div>
<div class="canto tl"></div><div class="canto br"></div>
<div class="titulo">Ordem<br>Paranormal<small>RPG 2 · Playtest Alpha</small></div>
<div class="sub">Sistema não-oficial para Foundry VTT</div>
<div class="dados"><span>d4</span><span class="seta">›</span><span>d6</span><span class="seta">›</span><span>d8</span><span class="seta">›</span><span>d10</span><span class="seta">›</span><span>d12</span></div>
<div class="mono">Licença da Comunidade · v13 · v14</div>
<img class="selo" src="../../assets/licenca/selo-branco.png">
</div></body></html>
