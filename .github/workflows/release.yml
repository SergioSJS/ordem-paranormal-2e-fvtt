name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  SYSTEM_ID: ordem-paranormal-2e

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # O CSS antes dos testes: ele é gerado pelo sass, não vai versionado, e um dos
      # testes confere que todo caminho declarado no manifesto existe no disco.
      - name: Verificação
        run: npm run lint && npm run build:css && npm test

      # As aventuras dos atos são geradas do PDF da editora e não vivem no
      # repositório: o script pula o que não tem fonte.
      - name: Build dos compêndios
        run: npm run pack:build

      - name: Fixar versão e URL de download no manifesto
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO=${{ github.repository }}
          DOWNLOAD="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/${SYSTEM_ID}.zip"
          jq --arg ver "$VERSION" --arg dl "$DOWNLOAD" \
            '.version = $ver | .download = $dl' \
            system.json > system.tmp.json && mv system.tmp.json system.json

      # Pack declarado sem banco no disco vira compêndio vazio na cara de quem
      # instala. As aventuras dos atos só existem para quem tem o PDF da editora,
      # então elas saem do manifesto publicado — e das pastas de compêndio junto.
      - name: Tirar do manifesto os compêndios que não foram gerados
        run: |
          FORA=$(jq -r '.packs[].name' system.json \
            | while read -r nome; do [ -d "packs/$nome" ] || echo "$nome"; done \
            | jq -R . | jq -s .)
          echo "sem banco no disco: $FORA"
          jq --argjson fora "$FORA" '
            .packs = [ .packs[] | select(.name as $n | $fora | index($n) | not) ]
            | .packFolders = (.packFolders | walk(
                if type == "object" and has("packs")
                then .packs = [ .packs[] | select(. as $n | $fora | index($n) | not) ]
                else . end))
            | .packFolders = (.packFolders | walk(
                if type == "object" and has("folders")
                then .folders = [ .folders[] | select((.packs | length) > 0 or ((.folders // []) | length) > 0) ]
                else . end))
          ' system.json > system.tmp.json && mv system.tmp.json system.json
          echo "compêndios publicados:"; jq -r '.packs[].name' system.json

      - name: Empacotar
        run: |
          zip -r "${SYSTEM_ID}.zip" \
            module/ templates/ lang/ assets/ packs/ \
            styles/op2.css \
            system.json \
            README.md LICENSE \
            --exclude "packs/sources/*"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SYSTEM_ID }}.zip
            system.json
          generate_release_notes: true
          fail_on_unmatched_files: true
