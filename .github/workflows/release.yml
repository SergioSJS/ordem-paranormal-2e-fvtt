name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Disparo manual para uma tag que já existe: o primeiro push de um repositório
  # novo não gerou o evento da tag (achado ao publicar a v0.9.0).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (vX.Y.Z), já criada"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  SYSTEM_ID: ordem-paranormal-2e

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # O CSS antes dos testes: ele é gerado pelo sass, não vai versionado, e um dos
      # testes confere que todo caminho declarado no manifesto existe no disco.
      - name: Verificação
        run: npm run lint && npm run build:css && npm test

      # As aventuras dos atos são geradas do PDF da editora e não vivem no
      # repositório: o script pula o que não tem fonte.
      - name: Build dos compêndios
        run: npm run pack:build

      - name: Fixar versão e URL de download no manifesto
        run: |
          VERSION=${TAG#v}
          REPO=${{ github.repository }}
          DOWNLOAD="https://github.com/${REPO}/releases/download/${TAG}/${SYSTEM_ID}.zip"
          jq --arg ver "$VERSION" --arg dl "$DOWNLOAD" \
            '.version = $ver | .download = $dl' \
            system.json > system.tmp.json && mv system.tmp.json system.json

      # Pack declarado sem banco no disco vira compêndio vazio na cara de quem
      # instala. As aventuras dos atos só existem para quem tem o PDF da editora,
      # então elas saem do manifesto publicado — e das pastas de compêndio junto.
      - name: Tirar do manifesto os compêndios que não foram gerados
        run: |
          FORA=$(jq -r '.packs[].name' system.json \
            | while read -r nome; do [ -d "packs/$nome" ] || echo "$nome"; done \
            | jq -R . | jq -s .)
          echo "sem banco no disco: $FORA"
          jq --argjson fora "$FORA" '
            .packs = [ .packs[] | select(.name as $n | $fora | index($n) | not) ]
            | .packFolders = (.packFolders | walk(
                if type == "object" and has("packs")
                then .packs = [ .packs[] | select(. as $n | $fora | index($n) | not) ]
                else . end))
            | .packFolders = (.packFolders | walk(
                if type == "object" and has("folders")
                then .folders = [ .folders[] | select((.packs | length) > 0 or ((.folders // []) | length) > 0) ]
                else . end))
          ' system.json > system.tmp.json && mv system.tmp.json system.json
          echo "compêndios publicados:"; jq -r '.packs[].name' system.json

      - name: Empacotar
        run: |
          zip -r "${SYSTEM_ID}.zip" \
            module/ templates/ lang/ assets/ packs/ \
            styles/op2.css \
            system.json \
            README.md LICENSE \
            --exclude "packs/sources/*"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ env.SYSTEM_ID }}.zip
            system.json

      # Registra a versão na listagem do Foundry (Package Release API). Só roda com o
      # token do pacote em `FOUNDRY_RELEASE_TOKEN` — antes da aprovação do pacote não
      # existe token, e o passo é pulado. O manifesto enviado é o DESTA versão (a API
      # exige URL fixa por versão); o `manifest` do system.json continua "latest".
      - name: Registrar a versão no Foundry
        if: ${{ secrets.FOUNDRY_RELEASE_TOKEN != '' }}
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: |
          VERSION=${TAG#v}
          REPO=${{ github.repository }}
          MIN=$(jq -r '.compatibility.minimum' system.json)
          VER=$(jq -r '.compatibility.verified' system.json)
          MAX=$(jq -r '.compatibility.maximum // empty' system.json)
          BODY=$(jq -n --arg id "$SYSTEM_ID" --arg v "$VERSION" \
            --arg manifest "https://github.com/${REPO}/releases/download/${TAG}/system.json" \
            --arg notes "https://github.com/${REPO}/releases/tag/${TAG}" \
            --arg min "$MIN" --arg ver "$VER" --arg max "$MAX" \
            '{id: $id, release: {version: $v, manifest: $manifest, notes: $notes,
              compatibility: ({minimum: $min, verified: $ver} + (if $max == "" then {} else {maximum: $max} end))}}')
          echo "$BODY" | jq .
          curl -sS -f -X POST https://foundryvtt.com/_api/packages/release_version/ \
            -H "Content-Type: application/json" -H "Authorization: $FOUNDRY_RELEASE_TOKEN" \
            -d "$BODY"
          generate_release_notes: true
          fail_on_unmatched_files: true
